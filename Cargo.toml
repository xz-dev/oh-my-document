[package]
name = "omd"
version = "0.0.0"
edition = "2024"
description = "Deterministic content and relationship tracking core"
license = "UNLICENSED"
publish = false

[lib]
name = "omd"
path = "src/lib.rs"

[[bin]]
name = "omd"
path = "src/main.rs"

[[test]]
name = "bdd"
path = "tests/bdd.rs"
harness = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
fslock = "0.2.1"
getrandom = "0.4.3"
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
similar = "3.2.0"
tempfile = "3.27.0"
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
toml = "1.1.6"

[dev-dependencies]
assert_cmd = "2.2.2"
cucumber = "0.23.0"
predicates = "3.1.4"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
